<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Joildo Brokers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #0A1128;
            --primary-blue: #1E3A8A;
            --gold: #D4AF37;
            --red-accent: #C62828;
            --bg-light: #F8FAFC;
            --text-dark: #0F172A;
            --text-muted: #475569;
            --white: #FFFFFF;
            --success: #198754;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* TELA DE LOGIN */
        #login-screen {
            background: linear-gradient(135deg, #0A1128 0%, #1E3A8A 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;
            position: fixed; top: 0; left: 0; z-index: 9999;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-box h2 { color: var(--primary-dark); margin-bottom: 1.5rem; }
        .login-box h2 span { color: var(--gold); }

        /* PAINEL INTERNO */
        #admin-panel { display: none; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .admin-header { background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* ABAS ESTILO MIGMÍDIA + ÓRULO */
        .tabs-container { display: flex; gap: 15px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 16px; background: white; border: 2px solid #E2E8F0; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; text-align: center; color: var(--text-muted); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .tab-btn.active { border-color: var(--primary-dark); color: var(--primary-dark); background: #EFF6FF; box-shadow: 0 4px 12px rgba(30,58,138,0.1); }
        .tab-btn i { color: var(--gold); }

        /* FORMULÁRIOS */
        .form-section { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; display: none; }
        .form-section.active { display: block; }
        .section-title { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem; background: #F8FAFC; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
        textarea.form-control { min-height: 100px; resize: vertical; }

        .btn-action { background: var(--success); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.3s; text-transform: uppercase; }
        .btn-action:hover { background: #155724; transform: translateY(-2px); }
        .btn-secondary { background: #64748B; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-secondary:hover { background: #475569; }
        .btn-puxar { background: var(--primary-blue); color: white; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-puxar:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>JOILDO<span>BROKERS</span></h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Painel de Controle Exclusivo</p>
            <div class="form-group"><input type="text" id="user" class="form-control" placeholder="Usuário (adm)"></div>
            <div class="form-group"><input type="password" id="pass" class="form-control" placeholder="Senha (1234)"></div>
            <button class="btn-action" onclick="fazerLogin()" style="margin-top: 10px;">Entrar no Painel</button>
        </div>
    </div>

    <!-- PAINEL ADMINISTRATIVO -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2 style="color: var(--primary-dark);"><i class="fas fa-cogs" style="color: var(--gold);"></i> Gerenciador de Imóveis (MigMídia & Órulo)</h2>
            <button onclick="logout()" class="btn-secondary"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>

        <!-- ABAS DE ESCOLHA -->
        <div class="tabs-container">
            <button class="tab-btn active" id="btnTabManual" onclick="mudarAba('manual')">
                <i class="fas fa-edit"></i> 1. Cadastro Manual (MigMídia)
            </button>
            <button class="tab-btn" id="btnTabOrulo" onclick="mudarAba('orulo')">
                <i class="fas fa-bolt"></i> 2. Importar do Órulo (Com Edição)
            </button>
        </div>

        <!-- ABA 1: CADASTRO MANUAL (MIGMÍDIA) -->
        <div class="form-section active" id="secManual">
            <div class="section-title"><i class="fas fa-house-medical"></i> Cadastro Manual de Imóvel</div>
            <form onsubmit="salvarImovel(event, 'manual')">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Título do Imóvel / Projeto:</label>
                        <input type="text" id="m_titulo" class="form-control" required placeholder="Ex: Residencial Vista Verde">
                    </div>
                    <div class="form-group">
                        <label>Construtora / Incorporadora:</label>
                        <input type="text" id="m_construtora" class="form-control" placeholder="Ex: Eztec">
                    </div>
                    <div class="form-group">
                        <label>Localização (Bairro / Cidade):</label>
                        <input type="text" id="m_localizacao" class="form-control" required placeholder="Ex: Pinheiros, São Paulo - SP">
                    </div>
                    <div class="form-group">
                        <label>Preço a partir de:</label>
                        <input type="text" id="m_preco" class="form-control" required placeholder="Ex: R$ 850.000">
                    </div>
                    <div class="form-group">
                        <label>Categoria na Home (Estágio):</label>
                        <select id="m_estagio" class="form-control">
                            <option value="lancamentos">Lançamentos</option>
                            <option value="construcao">Construção</option>
                            <option value="prontos">Prontos</option>
                            <option value="oportunidades">Oportunidades</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Área Útil:</label>
                        <input type="text" id="m_area" class="form-control" placeholder="Ex: 120m²">
                    </div>
                    <div class="form-group">
                        <label>Dormitórios:</label>
                        <input type="text" id="m_dormitorios" class="form-control" placeholder="Ex: 3">
                    </div>
                    <div class="form-group">
                        <label>Banheiros:</label>
                        <input type="text" id="m_banheiros" class="form-control" placeholder="Ex: 2">
                    </div>
                    <div class="form-group">
                        <label>Vagas:</label>
                        <input type="text" id="m_vagas" class="form-control" placeholder="Ex: 2">
                    </div>
                    <div class="form-group">
                        <label>URL da Foto Principal (Capa):</label>
                        <input type="url" id="m_foto" class="form-control" required placeholder="https://images.unsplash.com/...">
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-youtube" style="color: red;"></i> Link do Vídeo (YouTube):</label>
                        <input type="url" id="m_youtube" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-vr-cardboard" style="color: #00a8ff;"></i> Link do Tour Virtual 360°:</label>
                        <input type="url" id="m_tour" class="form-control" placeholder="https://my.matterport.com/show/?m=...">
                    </div>
                </div>
                <button type="submit" class="btn-action"><i class="fas fa-save"></i> Publicar Imóvel Manualmente</button>
            </form>
        </div>

        <!-- ABA 2: IMPORTAÇÃO DO ÓRULO COM EDIÇÃO COMPLETA -->
        <div class="form-section" id="secOrulo">
            <div class="section-title"><i class="fas fa-cloud-download-alt"></i> Importador do Órulo com Edição</div>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Cole o link do Órulo e clique em "Puxar Dados". O formulário abaixo será preenchido para você editar o que precisar antes de publicar.</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                <input type="url" id="urlOrulo" class="form-control" placeholder="https://www.orulo.com.br/buildings/82950" style="flex: 1;">
                <button class="btn-puxar" onclick="puxarDadosOrulo()"><i class="fas fa-search"></i> Puxar Dados</button>
            </div>

            <!-- Formulário de Edição Pré-Preenchido -->
            <form id="formOruloEdit" onsubmit="salvarImovel(event, 'orulo')" style="display:none; border-top: 2px dashed #CBD5E1; padding-top: 25px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome do Projeto:</label>
                        <input type="text" id="o_titulo" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Construtora:</label>
                        <input type="text" id="o_construtora" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Localização:</label>
                        <input type="text" id="o_localizacao" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Preço a partir de:</label>
                        <input type="text" id="o_preco" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Categoria na Home (Estágio):</label>
                        <select id="o_estagio" class="form-control">
                            <option value="lancamentos">Lançamentos</option>
                            <option value="construcao">Construção</option>
                            <option value="prontos">Prontos</option>
                            <option value="oportunidades">Oportunidades</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Área Útil:</label>
                        <input type="text" id="o_area" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Dormitórios:</label>
                        <input type="text" id="o_dormitorios" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Banheiros:</label>
                        <input type="text" id="o_banheiros" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Vagas:</label>
                        <input type="text" id="o_vagas" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>URL da Foto Principal (Capa):</label>
                        <input type="url" id="o_foto" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-youtube" style="color: red;"></i> Vídeo YouTube:</label>
                        <input type="url" id="o_youtube" class="form-control" placeholder="https://www.youtube.com/...">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-vr-cardboard" style="color: #00a8ff;"></i> Tour Virtual 360°:</label>
                        <input type="url" id="o_tour" class="form-control" placeholder="https://...">
                    </div>
                </div>
                <button type="submit" class="btn-action"><i class="fas fa-check-circle"></i> Salvar e Publicar Imóvel do Órulo</button>
            </form>
        </div>
    </div>

    <script>
        function fazerLogin() {
            if(document.getElementById('user').value === 'adm' && document.getElementById('pass').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert('Credenciais inválidas! Use adm / 1234');
            }
        }
        function logout() { location.reload(); }

        function mudarAba(aba) {
            if(aba === 'manual') {
                document.getElementById('secManual').classList.add('active');
                document.getElementById('secOrulo').classList.remove('active');
                document.getElementById('btnTabManual').classList.add('active');
                document.getElementById('btnTabOrulo').classList.remove('active');
            } else {
                document.getElementById('secOrulo').classList.add('active');
                document.getElementById('secManual').classList.remove('active');
                document.getElementById('btnTabOrulo').classList.add('active');
                document.getElementById('btnTabManual').classList.remove('active');
            }
        }

        async function puxarDadosOrulo() {
            const url = document.getElementById('urlOrulo').value;
            if(!url) return alert('Por favor, cole a URL do Órulo.');

            alert('Conectando ao Órulo para extrair informações...');
            try {
                const res = await fetch('/api/minerar-orulo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                
                if(data.success) {
                    const d = data.dados;
                    document.getElementById('o_titulo').value = d.nome_do_projeto || '';
                    document.getElementById('o_construtora').value = d.construtora || '';
                    document.getElementById('o_localizacao').value = d.localizacao || '';
                    document.getElementById('o_preco').value = d.preco_a_partir || '';
                    document.getElementById('o_estagio').value = d.estagio || 'lancamentos';
                    document.getElementById('o_area').value = d.area_util || '';
                    document.getElementById('o_dormitorios').value = d.dormitorios || '';
                    document.getElementById('o_banheiros').value = d.banheiros || '';
                    document.getElementById('o_vagas').value = d.vagas || '';
                    document.getElementById('o_foto').value = d.foto_principal || '';
                    
                    document.getElementById('formOruloEdit').style.display = 'block';
                    alert('Dados carregados com sucesso! Revise e clique em publicar.');
                }
            } catch(e) {
                alert('Erro ao puxar dados do Órulo.');
            }
        }

        async function salvarImovel(e, tipo) {
            e.preventDefault();
            const prefix = tipo === 'manual' ? 'm_' : 'o_';

            const imovel = {
                id: Date.now(),
                titulo: document.getElementById(prefix + 'titulo').value,
                construtora: document.getElementById(prefix + 'construtora').value,
                localizacao: document.getElementById(prefix + 'localizacao').value,
                preco: document.getElementById(prefix + 'preco').value,
                estagio: document.getElementById(prefix + 'estagio').value,
                area: document.getElementById(prefix + 'area').value,
                dormitorios: document.getElementById(prefix + 'dormitorios').value,
                banheiros: document.getElementById(prefix + 'banheiros').value,
                vagas: document.getElementById(prefix + 'vagas').value,
                foto: document.getElementById(prefix + 'foto').value,
                youtube: document.getElementById(prefix + 'youtube').value,
                tour360: document.getElementById(prefix + 'tour').value
            };

            const res = await fetch('/api/adicionar-imovel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(imovel)
            });

            const r = await res.json();
            if(r.success) {
                alert('Imóvel publicado com sucesso!');
                window.location.href = '/';
            } else {
                alert('Erro ao publicar imóvel.');
            }
        }
    </script>
</body>
</html>
