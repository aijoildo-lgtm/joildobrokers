<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Joildo Brokers | Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #002d72; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        .login-box h2 { color: #002d72; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #002d72; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #001f50; }
        #painel { display: none; width: 90%; max-width: 800px; background: white; padding: 30px; border-radius: 10px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login" class="login-box">
    <h2>Login Administrativo</h2>
    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="fazerLogin()">ACESSAR PAINEL</button>
</div>

<!-- PAINEL APÓS LOGIN -->
<div id="painel" class="login-box" style="width: 800px;">
    <h2>Joildo Brokers | Mineração Órulo</h2>
    <input type="url" id="urlOrulo" placeholder="Cole o link do Orulo aqui...">
    <button onclick="minerar()">Minerar e Publicar Imóvel</button>
    <div id="status" style="margin-top: 15px; font-weight: bold;"></div>
</div>

<script>
    function fazerLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // DEFINA AQUI SEU USUÁRIO E SENHA
        if(user === 'joildo' && pass === 'broker2024') {
            document.getElementById('login').style.display = 'none';
            document.getElementById('painel').style.display = 'block';
        } else {
            alert('Usuário ou senha inválidos!');
        }
    }

    async function minerar() {
        const url = document.getElementById('urlOrulo').value;
        const status = document.getElementById('status');
        status.innerText = "Processando... aguarde a extração...";
        
        try {
            const res = await fetch('/api/minerar-orulo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await res.json();
            if(data.success) {
                status.style.color = "green";
                status.innerText = "✅ Sucesso! Imóvel publicado: " + data.dados.titulo;
            } else {
                throw new Error("Erro na extração");
            }
        } catch (e) {
            status.style.color = "red";
            status.innerText = "❌ Erro ao conectar com o robô de mineração.";
        }
    }
</script>
</body>
</html>
