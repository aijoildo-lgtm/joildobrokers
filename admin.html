<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Joildo Brokers | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #002d72; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        .login-box h2 { color: #002d72; margin-bottom: 25px; font-weight: 800; }
        .login-box h2 span { color: #d4af37; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #002d72; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 1rem; transition: 0.3s; }
        button:hover { background: #001f50; }
        
        #painel { display: none; width: 90%; max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: left; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        input[type="url"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .loading { text-align: center; margin-top: 15px; color: #002d72; display: none; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login" class="login-box">
    <h2>JOILDO<span>BROKERS</span></h2>
    <p style="color: #666; margin-bottom: 20px;">Acesso restrito a corretores e administradores</p>
    <input type="text" id="username" placeholder="Usuário (joildo)" autocomplete="off">
    <input type="password" id="password" placeholder="Senha (broker2024)" autocomplete="off">
    <button onclick="fazerLogin()"><i class="fas fa-lock"></i> ACESSAR PAINEL</button>
</div>

<!-- PAINEL APÓS LOGIN -->
<div id="painel">
    <h2 style="color: #002d72; margin-bottom: 5px;"><i class="fas fa-cloud-download-alt"></i> Mineração de Dados Orulo</h2>
    <p style="color: #666; margin-bottom: 20px; font-size: 0.9rem;">Cole o link do imóvel do Orulo para extração automática de título, preço, localização e fotos.</p>

    <div class="form-group">
        <label for="urlOrulo">URL do Orulo (Ex: https://www.orulo.com.br/...):</label>
        <input type="url" id="urlOrulo" placeholder="https://www.orulo.com.br/buildings/...">
    </div>

    <button onclick="minerar()" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
        <i class="fas fa-play"></i> Iniciar Extração e Publicação
    </button>

    <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i> Conectando ao Orulo e parseando dados...
    </div>

    <div id="status" class="status-msg"></div>
</div>

<script>
    function fazerLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password');

        // Validação hardcoded conforme configurado
        if(user === 'joildo' && pass.value === 'broker2024') {
            document.getElementById('login').style.display = 'none';
            document.getElementById('painel').style.display = 'block';
        } else {
            alert('Credenciais inválidas! Verifique seu usuário e senha.');
            pass.value = '';
        }
    }

    // Permite ENTER no formulário de login
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            fazerLogin();
        }
    });

    async function minerar() {
        const url = document.getElementById('urlOrulo').value;
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');

        if(!url) {
            status.className = 'status-msg error';
            status.innerText = '⚠️ Por favor, cole a URL do Orulo antes de minerar.';
            return;
        }

        // Feedback visual de loading
        loading.style.display = 'block';
        status.style.display = 'none';

        try {
            const res = await fetch('/api/minerar-orulo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await res.json();

            if(data.success) {
                status.className = 'status-msg success';
                status.innerText = '✅ Sucesso! Imóvel "' + data.dados.título + '" minerado e salvo no banco de dados.';
                
                // Limpa o campo de URL após o sucesso
                document.getElementById('urlOrulo').value = '';
            } else {
                throw new Error(data.error || 'Erro desconhecido na mineração');
            }
        } catch (e) {
            status.className = 'status-msg error';
            status.innerText = '❌ ' + e.message;
        } finally {
            loading.style.display = 'none';
            status.style.display = 'block';
        }
    }
</script>
</body>
</html>
