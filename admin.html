<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Joildo Brokers | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #0A1128 0%, #1E3A8A 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #333;
        }

        /* Container do Card de Login com Efeito Glass */
        .login-box { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            padding: 3rem; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: var(--primary-dark, #0A1128); 
            text-decoration: none; 
            letter-spacing: -1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 1.5rem;
        }
        .logo span { color: var(--gold, #D4AF37); }

        .login-subtitle {
            color: #64748B;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* Inputs Estilizados */
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            color: var(--gold, #D4AF37);
            z-index: 2;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 1rem;
            background: #F8FAFC;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            color: #0F172A;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold, #D4AF37);
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        /* Botão de Login Premium */
        .btn-login {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #0A1128 0%, #1E3A8A 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #D4AF37 0%, #E5C158 100%);
            color: #0A1128;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        /* Container do Painel Interno (Após Login) */
        #painel {
            display: none;
            width: 95%;
            max-width: 1000px;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.5s ease;
        }

        .section-title {
            color: #0A1128;
            border-bottom: 2px solid var(--gold, #D4AF37);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .form-control textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-green {
            background: #198754;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-green:hover { background: #155724; }

        .btn-gray {
            background: #6C757D;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-gray:hover { background: #5a6268; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login" class="login-box">
        <a href="#" class="logo">JOILDO<span>BROKERS</span></a>
        <p class="login-subtitle">Painel Administrativo e de Mineração</p>
        
        <div class="form-group">
            <label for="username">Usuário de Acesso</label>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="form-control" placeholder="adm" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Senha de Segurança</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="off">
            </div>
        </div>

        <button class="btn-login" onclick="fazerLogin()">
            <i class="fas fa-sign-in-alt"></i> ACESSAR PAINEL
        </button>
    </div>

    <!-- PAINEL DE MINERAÇÃO E CADASTRO -->
    <div id="painel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #eee; padding-bottom: 1rem;">
            <h2 style="color: #0A1128; margin: 0; font-size: 1.8rem;"><i class="fas fa-cogs" style="color: var(--gold); margin-right: 10px;"></i> Painel do Corretor</h2>
            <button onclick="logout()" class="btn-gray" style="width: auto; padding: 10px 20px;"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>

        <!-- Tela Inicial: Input de URL -->
        <div id="screen-minerar">
            <div class="section-title" style="margin-top: 0; border: none;"><i class="fas fa-cloud-download-alt"></i> Mineração de Dados Orulo</div>
            <p style="color: #64748B; margin-bottom: 1.5rem; line-height: 1.6;">
                Cole o link do imóvel do Orulo para extração automática de todas as especificações técnicas, tipologias e preços.
            </p>

            <div class="form-group">
                <label for="urlOrulo">URL do Orulo (Ex: https://www.orulo.com.br/buildings/...):</label>
                <div class="input-group">
                    <i class="fas fa-link"></i>
                    <input type="url" id="urlOrulo" class="form-control" placeholder="https://www.orulo.com.br/buildings/">
                </div>
            </div>

            <button class="btn-green" style="width: 100%; padding: 1.2rem; font-size: 1rem; margin-top: 1rem;" onclick="minerar()">
                <i class="fas fa-search"></i> Iniciar Mineração Automática
            </button>

            <div id="status" class="status-msg" style="display:none; margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold;"></div>
        </div>

        <!-- Tela de Revisão (Gerada Dinamicamente) -->
        <div id="screen-revisao" style="display:none;"></div>
    </div>

    <script>
        // --- LÓGICA DE LOGIN CORRIGIDA E ROBUSTA ---
        function fazerLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // Validação de credenciais
            if (user === 'adm' && pass === '1234') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
            } else {
                // Feedback visual de erro nos campos
                const userField = document.getElementById('username');
                const passField = document.getElementById('password');
                
                userField.style.borderColor = '#dc3545';
                passField.style.borderColor = '#dc3545';
                
                alert('Credenciais inválidas! Por favor, verifique:\nUsuário: adm\nSenha: 1234');
                
                setTimeout(() => {
                    userField.style.borderColor = '#E2E8F0';
                    passField.style.borderColor = '#E2E8F0';
                }, 1500);
            }
        }

        // Permite login ao pressionar Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
                fazerLogin();
            }
        });

        function logout() {
            document.getElementById('painel').style.display = 'none';
            document.getElementById('login').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function minerar() {
            const url = document.getElementById('urlOrulo').value;
            const status = document.getElementById('status');

            if(!url) {
                status.className = 'status-msg error';
                status.style.display = 'block';
                status.innerText = '⚠️ Por favor, cole a URL do Orulo antes de minerar.';
                return;
            }

            status.style.display = 'none';
            status.innerText = '';

            const originalBtn = event.target.innerHTML;
            event.target.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Consultando Orulo...';
            event.target.disabled = true;

            try {
                const res = await fetch('/api/minerar-orulo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await res.json();

                if(data.success) {
                    renderReviewForm(data.dados);
                    document.getElementById('screen-minerar').style.display = 'none';
                    document.getElementById('screen-revisao').style.display = 'block';
                } else {
                    throw new Error(data.error || 'Erro na extração');
                }
            } catch (e) {
                status.className = 'status-msg error';
                status.style.display = 'block';
                status.style.background = '#F8D7DA';
                status.style.color = '#721C24';
                status.innerText = '❌ ' + e.message;
            } finally {
                event.target.innerHTML = originalBtn;
                event.target.disabled = false;
            }
        }

        function renderReviewForm(dados) {
            const container = document.getElementById('screen-revisao');
            
            // Converte tipologias em linhas de tabela para exibição
            let tipologiasRows = '';
            if (dados.tipologias && dados.tipologias.length > 0) {
                dados.tipologias.forEach(t => {
                    tipologiasRows += `
                        <tr>
                            <td><input type="text" name="tipo[]" value="${t.tipo || ''}" placeholder="Tipo" class="form-control" style="padding: 6px;"></td>
                            <td><input type="text" name="area_tipologia[]" value="${t.area || ''}" placeholder="Área" class="form-control" style="padding: 6px;"></td>
                            <td><input type="text" name="dorm_tipologia[]" value="${t.dormitivos || ''}" placeholder="Dorm." class="form-control" style="padding: 6px;"></td>
                            <td><input type="text" name="ban_tipologia[]" value="${t.banheiros || ''}" placeholder="Banheiros" class="form-control" style="padding: 6px;"></td>
                            <td><input type="text" name="preco_tipologia[]" value="${t.preco || ''}" placeholder="Preço" class="form-control" style="padding: 6px;"></td>
                        </tr>`;
                });
            } else {
                tipologiasRows = `
                    <tr>
                        <td><input type="text" name="tipo[]" value="" placeholder="Tipo" class="form-control" style="padding: 6px;"></td>
                        <td><input type="text" name="area_tipologia[]" value="" placeholder="Área" class="form-control" style="padding: 6px;"></td>
                        <td><input type="text" name="dorm_tipologia[]" value="" placeholder="Dorm." class="form-control" style="padding: 6px;"></td>
                        <td><input type="text" name="ban_tipologia[]" value="" placeholder="Banheiros" class="form-control" style="padding: 6px;"></td>
                        <td><input type="text" name="preco_tipologia[]" value="" placeholder="Preço" class="form-control" style="padding: 6px;"></td>
                    </tr>`;
            }

            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="color: #0A1128; margin: 0;"><i class="fas fa-edit"></i> Revisão e Publicação</h3>
                    <button onclick="voltarMineracao()" class="btn-gray" style="width: auto; padding: 10px 20px;">Voltar</button>
                </div>
                <p style="color: #64748B; margin-bottom: 1.5rem; line-height: 1.6;">
                    Revise os dados extraídos do Orulo. Você pode corrigir informações e adicionar as URLs de mídia (YouTube, Tour Virtual e fotos adicionais) antes de publicar.
                </p>

                <form id="form-publicacao">
                    <!-- SEÇÃO: MÍDIA E FOTOS -->
                    <div class="section-title"><i class="fas fa-images"></i> Mídia e Imagens</div>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="foto_principal">URL da Foto Principal (Capa):</label>
                            <input type="url" name="foto_principal" id="foto_principal" value="${dados.foto_principal}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="fotos_extras">Fotos Extras (URLs separadas por vírgula):</label>
                            <input type="text" name="fotos_extras" id="fotos_extras" value="${dados.fotos_extras.join(', ')}" class="form-control" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label for="youtube_url">Vídeo do YouTube:</label>
                            <input type="url" name="youtube_url" id="youtube_url" value="${dados.youtube_url}" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div class="form-group">
                            <label for="tour_virtual_url">Tour Virtual 360°:</label>
                            <input type="url" name="tour_virtual_url" id="tour_virtual_url" value="${dados.tour_virtual_url}" class="form-control" placeholder="https://...">
                        </div>
                    </div>

                    <!-- SEÇÃO: DADOS BÁSICOS -->
                    <div class="section-title"><i class="fas fa-building"></i> Dados do Projeto e Construtora</div>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="nome_do_projeto">Nome do Projeto:</label>
                            <input type="text" name="nome_do_projeto" id="nome_do_projeto" value="${dados.nome_do_projeto}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="construtora">Construtora / Incorporadora:</label>
                            <input type="text" name="construtora" id="construtora" value="${dados.construtora}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="localizacao">Localização:</label>
                            <input type="text" name="localizacao" id="localizacao" value="${dados.localizacao}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="estagio">Estágio do Imóvel (Filtro):</label>
                            <select name="estagio" id="estagio" class="form-control">
                                <option value="outros">Outros / Geral</option>
                                <option value="prontos">Pronto</option>
                                <option value="construção">Construção / Obra</option>
                                <option value="oportunidades">Oportunidade / Promoção</option>
                                <option value="mcmv">MCMV / Minha Casa Minha Vida</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="preco_a_partir">Preço a partir de:</label>
                            <input type="text" name="preco_a_partir" id="preco_a_partir" value="${dados.preco_a_partir}" class="form-control">
                        </div>
                    </div>

                    <!-- SEÇÃO: CARACTERÍSTICAS TÉCNICAS -->
                    <div class="section-title"><i class="fas fa-ruler-combined"></i> Características Técnicas</div>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="area_util">Área útil:</label>
                            <input type="text" name="area_util" id="area_util" value="${dados.area_util}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="dormitorios">Dormitórios:</label>
                            <input type="text" name="dormitorios" id="dormitorios" value="${dados.dormitorios}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="suites">Suítes:</label>
                            <input type="text" name="suites" id="suites" value="${dados.suites}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="banheiros">Banheiros:</label>
                            <input type="text" name="banheiros" id="banheiros" value="${dados.banheiros}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="vagas">Vagas de carro:</label>
                            <input type="text" name="vagas" id="vagas" value="${dados.vagas}" class="form-control">
                        </div>
                    </div>

                    <!-- SEÇÃO: CONDOMÍNIO E TIPOLOGIAS -->
                    <div class="section-title"><i class="fas fa-swimming-pool"></i> Condomínio e Tipologias</div>
                    <div class="grid-form">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="lazer">Características do Condomínio / Lazer:</label>
                            <textarea name="lazer" id="lazer" class="form-control" rows="3">${dados.lazer}</textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Tipologias Disponíveis (Editável):</label>
                            <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                                <thead>
                                    <tr style="background: #F1F5F9;">
                                        <th style="padding: 8px; text-align: left; border: 1px solid #E2E8F0;">Tipo</th>
                                        <th style="padding: 8px; text-align: left; border: 1px solid #E2E8F0;">Área</th>
                                        <th style="padding: 8px; text-align: left; border: 1px solid #E2E8F0;">Dormitórios</th>
                                        <th style="padding: 8px; text-align: left; border: 1px solid #E2E8F0;">Banheiros</th>
                                        <th style="padding: 8px; text-align: left; border: 1px solid #E2E8F0;">Preço</th>
                                    </tr>
                                </thead>
                                <tbody id="tipologias-tbody">
                                    ${tipologiasRows}
                                </tbody>
                            </table>
                            <button type="button" class="btn-blue" style="margin-top: 10px; width: auto; padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="adicionarLinhaTipologia()">
                                <i class="fas fa-plus"></i> Adicionar Linha
                            </button>
                        </div>
                    </div>

                    <div style="margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" onclick="voltarMineracao()" class="btn-gray" style="width: auto; padding: 1rem 2rem;">Voltar</button>
                        <button type="submit" class="btn-green" style="width: auto; padding: 1rem 3rem; font-size: 1.05rem;">
                            <i class="fas fa-save"></i> Confirmar e Publicar Imóvel
                        </button>
                    </div>
                </form>
            `;
            document.getElementById('form-publicacao').addEventListener('submit', function(e) {
                e.preventDefault();
                submitPublicacao(new FormData(this));
            });
        }

        function adicionarLinhaTipologia() {
            const tbody = document.getElementById('tipologias-tbody');
            const novaLinha = document.createElement('tr');
            novaLinha.innerHTML = `
                <td><input type="text" name="tipo[]" value="" placeholder="Tipo" class="form-control" style="padding: 6px;"></td>
                <td><input type="text" name="area_tipologia[]" value="" placeholder="Área" class="form-control" style="padding: 6px;"></td>
                <td><input type="text" name="dorm_tipologia[]" value="" placeholder="Dorm." class="form-control" style="padding: 6px;"></td>
                <td><input type="text" name="ban_tipologia[]" value="" placeholder="Banheiros" class="form-control" style="padding: 6px;"></td>
                <td><input type="text" name="preco_tipologia[]" value="" placeholder="Preço" class="form-control" style="padding: 6px;"></td>
            `;
            tbody.appendChild(novaLinha);
        }

        function voltarMineracao() {
            document.getElementById('screen-revisao').style.display = 'none';
            document.getElementById('screen-minerar').style.display = 'block';
        }

        function submitPublicacao(formData) {
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            // Processa as tipologias da tabela
            const tipos = formData.getAll('tipo[]');
            const areas = formData.getAll('area_tipologia[]');
            const dorms = formData.getAll('dorm_tipologia[]');
            const bans = formData.getAll('ban_tipologia[]');
            const precos = formData.getAll('preco_tipologia[]');

            data.tipologias = [];
            for (let i = 0; i < tipos.length; i++) {
                if (tipos[i] || areas[i] || precos[i]) {
                    data.tipologias.push({
                        tipo: tipos[i],
                        area: areas[i],
                        dormitivos: dorms[i],
                        banheiros: bans[i],
                        preco: precos[i]
                    });
                }
            }

            // Converte fotos_extras string para array
            if (data.fotos_extras) {
                data.fotos_extras = data.fotos_extras.split(',').map(url => url.trim()).filter(url => url !== '');
            }

            data.id = Date.now();
            data.data_extracao = new Date().toISOString();

            fetch('/api/adicionar-imovel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw err; });
                }
                return response.json();
            })
            .then(resp => {
                if(resp.success) {
                    alert('✅ Imóvel publicado com sucesso!');
                    window.location.href = '/';
                } else {
                    alert('❌ ' + (resp.error || 'Erro desconhecido ao publicar.'));
                }
            })
            .catch(err => {
                console.error(err);
                alert('⚠️ ' + (err.error || 'Falha de conexão ao publicar.'));
            });
        }
    </script>
</body>
</html>
