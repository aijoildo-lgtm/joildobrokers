<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigMídia CPanel | Joildo Brokers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A1128;
            --blue: #1E3A8A;
            --gold: #D4AF37;
            --bg-light: #F1F5F9;
            --text-dark: #0F172A;
            --success: #198754;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); }

        #login-screen {
            background: linear-gradient(135deg, #0A1128 0%, #1E3A8A 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;
            position: fixed; top: 0; left: 0; z-index: 9999;
        }
        .login-box {
            background: #ffffff; padding: 3rem; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-box h2 { color: var(--primary); margin-bottom: 1.5rem; font-weight: 800; }
        .login-box h2 span { color: var(--gold); }

        #admin-panel { display: none; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .admin-header { background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .tabs-container { display: flex; gap: 15px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 16px; background: white; border: 2px solid #E2E8F0; border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; color: var(--text-dark); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .tab-btn.active { border-color: var(--primary); color: var(--primary); background: #EFF6FF; }
        .tab-btn i { color: var(--gold); }

        .form-section { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; display: none; }
        .form-section.active { display: block; }
        .section-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem; background: #F8FAFC; outline: none; }
        .form-control:focus { border-color: var(--gold); background: white; }

        .btn-action { background: var(--success); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; text-transform: uppercase; }
        .btn-secondary { background: #64748B; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-puxar { background: var(--blue); color: white; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>JOILDO<span>BROKERS</span></h2>
            <p style="font-size: 0.85rem; margin-bottom: 20px;">Painel de Controle Estilo MigMídia</p>
            <div class="form-group"><input type="text" id="user" class="form-control" placeholder="Usuário (adm)"></div>
            <div class="form-group"><input type="password" id="pass" class="form-control" placeholder="Senha (1234)"></div>
            <button class="btn-action" onclick="fazerLogin()" style="margin-top: 10px;">Acessar Sistema</button>
        </div>
    </div>

    <!-- PAINEL -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2><i class="fas fa-cogs" style="color: var(--gold);"></i> MigMídia CPanel</h2>
            <button onclick="logout()" class="btn-secondary">Sair</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" id="btnTabManual" onclick="mudarAba('manual')">
                <i class="fas fa-edit"></i> Cadastro Manual
            </button>
            <button class="tab-btn" id="btnTabOrulo" onclick="mudarAba('orulo')">
                <i class="fas fa-bolt"></i> Importar do Órulo e Editar
            </button>
        </div>

        <!-- MODO MANUAL -->
        <div class="form-section active" id="secManual">
            <div class="section-title"><i class="fas fa-house-medical"></i> Novo Imóvel Manual</div>
            <form onsubmit="salvarImovel(event, 'm')">
                <div class="form-grid">
                    <div class="form-group"><label>Título do Imóvel:</label><input type="text" id="m_titulo" class="form-control" required placeholder="Ex: Residencial Premium Tatuapé"></div>
                    <div class="form-group"><label>Preço:</label><input type="text" id="m_preco" class="form-control" required placeholder="Ex: R$ 890.000"></div>
                    <div class="form-group"><label>Localização (Cidade/Bairro):</label><input type="text" id="m_localizacao" class="form-control" required placeholder="Ex: Tatuapé, São Paulo - SP"></div>
                    <div class="form-group">
                        <label>Estágio / Categoria:</label>
                        <select id="m_estagio" class="form-control">
                            <option value="lancamentos">Lançamentos</option>
                            <option value="construcao">Construção</option>
                            <option value="prontos">Prontos</option>
                            <option value="oportunidades">Oportunidades</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Área Útil:</label><input type="text" id="m_area" class="form-control" placeholder="Ex: 110m²"></div>
                    <div class="form-group"><label>Dormitórios:</label><input type="text" id="m_dormitorios" class="form-control" placeholder="Ex: 3 dormitórios"></div>
                    <div class="form-group"><label>URL da Imagem Capa:</label><input type="url" id="m_foto" class="form-control" required placeholder="https://..."></div>
                    <div class="form-group"><label><i class="fab fa-youtube" style="color:red"></i> Vídeo do YouTube:</label><input type="url" id="m_youtube" class="form-control" placeholder="https://youtube.com/..."></div>
                    <div class="form-group"><label><i class="fas fa-vr-cardboard" style="color:blue"></i> Tour Virtual 360°:</label><input type="url" id="m_tour360" class="form-control" placeholder="https://..."></div>
                </div>
                <button type="submit" class="btn-action">Publicar Imóvel</button>
            </form>
        </div>

        <!-- MODO ÓRULO -->
        <div class="form-section" id="secOrulo">
            <div class="section-title"><i class="fas fa-cloud-download-alt"></i> Importar do Órulo e Editar</div>
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <input type="url" id="urlOrulo" class="form-control" placeholder="https://www.orulo.com.br/buildings/82950">
                <button class="btn-puxar" onclick="puxarDadosOrulo()">Puxar Dados</button>
            </div>

            <form id="formOruloEdit" onsubmit="salvarImovel(event, 'o')" style="display:none; border-top: 1px dashed #ddd; padding-top: 25px;">
                <div class="form-grid">
                    <div class="form-group"><label>Título do Imóvel:</label><input type="text" id="o_titulo" class="form-control" required></div>
                    <div class="form-group"><label>Preço:</label><input type="text" id="o_preco" class="form-control" required></div>
                    <div class="form-group"><label>Localização:</label><input type="text" id="o_localizacao" class="form-control" required></div>
                    <div class="form-group">
                        <label>Estágio / Categoria:</label>
                        <select id="o_estagio" class="form-control">
                            <option value="lancamentos">Lançamentos</option>
                            <option value="construcao">Construção</option>
                            <option value="prontos">Prontos</option>
                            <option value="oportunidades">Oportunidades</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Área:</label><input type="text" id="o_area" class="form-control"></div>
                    <div class="form-group"><label>Dormitórios:</label><input type="text" id="o_dormitorios" class="form-control"></div>
                    <div class="form-group"><label>URL da Imagem:</label><input type="url" id="o_foto" class="form-control" required></div>
                    <div class="form-group"><label><i class="fab fa-youtube" style="color:red"></i> Vídeo do YouTube:</label><input type="url" id="o_youtube" class="form-control"></div>
                    <div class="form-group"><label><i class="fas fa-vr-cardboard" style="color:blue"></i> Tour Virtual 360°:</label><input type="url" id="o_tour360" class="form-control"></div>
                </div>
                <button type="submit" class="btn-action">Publicar Dados do Órulo</button>
            </form>
        </div>
    </div>

    <script>
        function fazerLogin() {
            if(document.getElementById('user').value === 'adm' && document.getElementById('pass').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert('Acesso inválido!'); }
        }
        function logout() { location.reload(); }

        function mudarAba(aba) {
            if(aba === 'manual') {
                document.getElementById('secManual').classList.add('active');
                document.getElementById('secOrulo').classList.remove('active');
                document.getElementById('btnTabManual').classList.add('active');
                document.getElementById('btnTabOrulo').classList.remove('active');
            } else {
                document.getElementById('secOrulo').classList.add('active');
                document.getElementById('secManual').classList.remove('active');
                document.getElementById('btnTabOrulo').classList.add('active');
                document.getElementById('btnTabManual').classList.remove('active');
            }
        }

        async function puxarDadosOrulo() {
            const url = document.getElementById('urlOrulo').value;
            if(!url) return alert('Insira a URL do Órulo!');

            try {
                const res = await fetch('/api/minerar-orulo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                const r = await res.json();
                if(r.success) {
                    document.getElementById('o_titulo').value = r.dados.titulo;
                    document.getElementById('o_preco').value = r.dados.preco;
                    document.getElementById('o_localizacao').value = r.dados.localizacao;
                    document.getElementById('o_area').value = r.dados.area;
                    document.getElementById('o_dormitorios').value = r.dados.dormitorios;
                    document.getElementById('o_foto').value = r.dados.foto;
                    
                    document.getElementById('formOruloEdit').style.display = 'block';
                }
            } catch(err) { alert('Erro ao buscar dados do Órulo.'); }
        }

        async function salvarImovel(e, pref) {
            e.preventDefault();
            const imovel = {
                id: Date.now(),
                titulo: document.getElementById(pref + '_titulo').value,
                preco: document.getElementById(pref + '_preco').value,
                foto: document.getElementById(pref + '_foto').value,
                localizacao: document.getElementById(pref + '_localizacao').value,
                estagio: document.getElementById(pref + '_estagio').value,
                area: document.getElementById(pref + '_area').value,
                dormitorios: document.getElementById(pref + '_dormitorios').value,
                youtube: document.getElementById(pref + '_youtube').value,
                tour360: document.getElementById(pref + '_tour360').value
            };

            const res = await fetch('/api/adicionar-imovel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(imovel)
            });
            const r = await res.json();
            if(r.success) {
                alert('Imóvel publicado!');
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
