<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPanel MigMídia | Joildo Brokers</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0A1128; --gold: #D4AF37; --bg: #F1F5F9; --white: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); padding: 20px; }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }

        .container { max-width: 1050px; margin: 0 auto; background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: none; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 25px; }
        .section-title { background: #f8f9fa; padding: 10px 15px; font-weight: bold; margin-top: 25px; border-left: 4px solid var(--gold); font-size: 0.9rem; text-transform: uppercase; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; padding: 15px 0; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; color: #555; }
        input, select, textarea { padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; outline: none; font-size: 0.9rem; }
        
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; padding: 15px 0; max-height: 200px; overflow-y: auto; border: 1px solid #E2E8F0; padding: 15px; border-radius: 6px; }
        .checkbox-item { font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .btn-pub { background: #198754; color: white; border: none; padding: 16px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 25px; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card login-box">
            <h2 style="color:var(--primary); margin-bottom: 10px;">JOILDO <span>BROKERS</span></h2>
            <p style="font-size:0.8rem; color:#666; margin-bottom: 20px;">Painel de Controle Estilo MigMídia</p>
            <input type="text" id="user" placeholder="Usuário (adm)">
            <input type="password" id="pass" placeholder="Senha (1234)">
            <button onclick="fazerLogin()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">ACESSAR CPANEL</button>
        </div>
    </div>

    <!-- PAINEL CPANEL -->
    <div class="container" id="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2><i class="fas fa-cogs"></i> Painel de Controle de Imóveis</h2>
            <a href="/" target="_blank" style="color:var(--primary); font-weight:bold; text-decoration:none;"><i class="fas fa-external-link-alt"></i> Ver Site no Ar</a>
        </div>

        <!-- MINERAÇÃO ÓRULO -->
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Link de Importação do Órulo</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="urlOrulo" style="flex:1" placeholder="https://www.orulo.com.br/buildings/82950">
                <button onclick="minerar()" style="padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Puxar Dados do Órulo</button>
            </div>
        </div>

        <form onsubmit="salvar(event)">
            <div class="section-title">1. Transação e Categoria</div>
            <div class="form-grid">
                <div class="form-group"><label>Transação</label><select id="transacao"><option>Vender Imóvel</option><option>Alugar Imóvel</option></select></div>
                <div class="form-group"><label>Categoria</label><select id="categoria"><option>Residencial</option><option>Comercial</option><option>Rural</option></select></div>
                <div class="form-group">
                    <label>Tipo de Imóvel</label>
                    <select id="tipo">
                        <option>Apartamento</option><option>Casa</option><option>Casa de Condomínio</option><option>Cobertura</option><option>Flat</option><option>Studio</option><option>Terreno / Lote</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tarja de Destaque</label>
                    <select id="destaque">
                        <option value="none">Nenhuma</option>
                        <option value="exclusivo">Exclusividade</option>
                        <option value="desconto">20% de Desconto</option>
                        <option value="oportunidade">Oportunidade</option>
                        <option value="decorado">Decorado</option>
                        <option value="pronto">Pronto para Morar</option>
                    </select>
                </div>
            </div>

            <div class="section-title">2. Endereço do Imóvel</div>
            <div class="form-grid">
                <div class="form-group"><label>Cidade / Bairro / UF</label><input type="text" id="cidade" placeholder="São Paulo - SP"></div>
            </div>

            <div class="section-title">3. Dados do Anúncio & Características</div>
            <div class="form-grid">
                <div class="form-group"><label>Título do Anúncio</label><input type="text" id="titulo" required placeholder="Ex: Town Residences Jardins"></div>
                <div class="form-group"><label>Preço (R$)</label><input type="text" id="preco" required placeholder="Ex: R$ 850.000"></div>
                <div class="form-group"><label>Estágio / Categoria</label>
                    <select id="estagio">
                        <option value="lancamentos">Lançamentos</option>
                        <option value="construcao">Construção</option>
                        <option value="prontos">Prontos</option>
                        <option value="oportunidades">Oportunidades</option>
                    </select>
                </div>
                <div class="form-group"><label>Área Útil (m²)</label><input type="text" id="area" placeholder="Ex: 110m²"></div>
                <div class="form-group"><label>Dormitórios</label><input type="text" id="dormitorios" placeholder="Ex: 3 dorms"></div>
                <div class="form-group"><label>Vagas</label><input type="text" id="vagas" placeholder="Ex: 2 vagas"></div>
            </div>

            <div class="section-title">4. Mídias (Fotos, Vídeo e Tour 360)</div>
            <div class="form-grid">
                <div class="form-group"><label>URL Foto Capa</label><input type="url" id="foto" required placeholder="https://..."></div>
                <div class="form-group"><label>Link Vídeo YouTube</label><input type="url" id="youtube" placeholder="https://youtube.com/..."></div>
                <div class="form-group"><label>Link Tour Virtual 360°</label><input type="url" id="tour360" placeholder="https://..."></div>
            </div>

            <button type="submit" class="btn-pub"><i class="fas fa-check-circle"></i> Publicar Imóvel no Portal</button>
        </form>
    </div>

    <script>
        function fazerLogin() {
            if(document.getElementById('user').value === 'adm' && document.getElementById('pass').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
            } else { alert('Acesso negado!'); }
        }

        async function minerar() {
            const url = document.getElementById('urlOrulo').value;
            if(!url) return alert('Cole a URL do Órulo!');
            
            const res = await fetch('/api/minerar-orulo', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({url}) 
            });
            
            const r = await res.json();
            if(r.success) {
                document.getElementById('titulo').value = r.dados.titulo || '';
                document.getElementById('preco').value = r.dados.preco || '';
                document.getElementById('cidade').value = r.dados.localizacao || '';
                document.getElementById('area').value = r.dados.area || '';
                document.getElementById('dormitorios').value = r.dados.dormitorios || '';
                document.getElementById('foto').value = r.dados.foto || '';
                alert('✅ Dados extraídos com sucesso do Órulo! Você pode ajustar o título se desejar antes de publicar.');
            }
        }

        async function salvar(e) {
            e.preventDefault();
            const imovel = {
                titulo: document.getElementById('titulo').value,
                preco: document.getElementById('preco').value,
                localizacao: document.getElementById('cidade').value || 'São Paulo - SP',
                estagio: document.getElementById('estagio').value,
                destaque: document.getElementById('destaque').value,
                area: document.getElementById('area').value,
                dormitorios: document.getElementById('dormitorios').value,
                vagas: document.getElementById('vagas').value,
                foto: document.getElementById('foto').value,
                youtube: document.getElementById('youtube').value,
                tour360: document.getElementById('tour360').value
            };

            const res = await fetch('/api/adicionar-imovel', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(imovel)
            });
            const r = await res.json();
            if(r.success) {
                alert('🎉 Imóvel Publicado com Sucesso no Portal! Código: ' + r.ref);
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
